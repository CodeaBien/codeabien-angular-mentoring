# Configuración de Lefthook para Git Hooks
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
  - run: npx @biomejs/biome format --write --fix {staged_files}
    glob: "**/*.{ts,js,json}"
    stage_fixed: true

  - run: npx @biomejs/biome lint --fix {staged_files}
    glob: "**/*.{ts,json}"
    stage_fixed: true
